<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Mi Súper">
    <meta name="theme-color" content="#161615">

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">

    <title>Mi Súper</title>
    
    <script src="config.js"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">

    <style>
        /* Sistema visual v24: papel + tinta, un acento semántico (verde = en el carrito / comprado),
           fuente del sistema para la interfaz y serif solo para títulos. Reglas finas en vez de cards. */
        :root {
            --paper: #fbfbfa; --paper-2: #f3f2ef; --ink: #161615; --ink-2: #57544f; --ink-3: #8c8881;
            --rule: #e3e0da; --accent: #2f6b45; --accent-soft: #e7efe9; --danger: #a3261f; --warn: #8a5a14;
            --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom);
            --gutter: 16px;
        }
        html, body { height: 100%; margin: 0; overflow: hidden; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Helvetica Neue", sans-serif; background: #e9e7e2; color: var(--ink); -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; -webkit-font-smoothing: antialiased; }
        #root { position: fixed; left: 0; right: 0; top: var(--vv-top, 0px); height: 100vh; height: var(--vv-h, 100dvh); }
        input, textarea, select { font-size: 16px; font-family: inherit; color: inherit; }
        button { font-family: inherit; }
        .serif { font-family: "Newsreader", "Iowan Old Style", Georgia, serif; font-optical-sizing: auto; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Cabecera */
        .ms-mast { background: var(--ink); color: var(--paper); padding: calc(max(12px, var(--sat)) + 4px) var(--gutter) 10px; }
        .ms-mast-meta { color: #a9a59d; font-size: 12px; }
        .ms-icon-btn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; color: inherit; cursor: pointer; flex-shrink: 0; }
        .ms-icon-btn:active { background: rgba(127,127,127,.18); }
        .ms-icon-btn:disabled { opacity: .35; }
        .ms-add { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid #4a4843; margin-top: 10px; }
        .ms-add input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; padding: 10px 0; font-size: 17px; color: var(--paper); }
        .ms-add input::placeholder { color: #8f8b83; }
        .ms-toggle { font-size: 14px; padding: 8px 2px; white-space: nowrap; color: var(--ink-3); border-bottom: 2px solid transparent; flex-shrink: 0; }
        .ms-toggle[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
        .ms-mast .ms-toggle { color: #8f8b83; }
        .ms-mast .ms-toggle[aria-pressed="true"] { color: var(--paper); border-bottom-color: var(--paper); }

        /* Pestañas */
        .ms-tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--paper); border-bottom: 1px solid var(--rule); }
        .ms-tab { padding: 12px 0 10px; font-size: 15px; color: var(--ink-3); border-bottom: 2px solid transparent; margin-bottom: -1px; }
        .ms-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
        .ms-count { font-size: 12px; color: var(--ink-3); font-weight: 400; margin-left: 4px; font-variant-numeric: tabular-nums; }

        /* Lista */
        .ms-scroll { background: var(--paper); }
        .ms-tools { padding: 4px var(--gutter) 8px; }
        .ms-search { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; border-bottom: 1px solid var(--rule); color: var(--ink-3); }
        .ms-search input { flex: 1; min-width: 0; background: transparent; outline: 0; border: 0; padding: 9px 0; font-size: 16px; color: var(--ink); }
        .ms-select { background: transparent; border: 0; font-size: 14px; color: var(--ink-2); padding: 9px 2px; }
        .ms-row { display: flex; align-items: center; gap: 10px; padding: 10px var(--gutter); border-bottom: 1px solid var(--rule); min-height: 60px; }
        .ms-row.is-cart .ms-name { text-decoration: line-through; color: var(--ink-3); }
        .ms-row.is-inactive { opacity: .6; }
        .ms-name { font-size: 16px; font-weight: 500; line-height: 1.3; }
        .ms-meta { font-size: 13px; color: var(--ink-3); line-height: 1.35; margin-top: 2px; }
        .ms-meta .danger { color: var(--danger); font-weight: 600; }
        .ms-meta .warn { color: var(--warn); }
        .ms-check { width: 44px; height: 44px; margin: -8px -6px -8px -10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ms-check span { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #b9b5ad; display: flex; align-items: center; justify-content: center; color: #fff; }
        .ms-row.is-cart .ms-check span { background: var(--accent); border-color: var(--accent); }
        .ms-thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: var(--paper-2); }
        .ms-row-actions { display: flex; align-items: center; margin-right: -8px; color: var(--ink-3); }
        .ms-row-actions .ms-icon-btn { width: 36px; height: 40px; }
        .ms-group { padding: 18px var(--gutter) 6px; font-size: 13px; color: var(--ink-2); font-variant: small-caps; letter-spacing: .02em; border-bottom: 1px solid var(--rule); text-transform: lowercase; }
        .ms-note { margin: 8px var(--gutter); font-size: 13px; color: var(--ink-2); }
        .ms-empty { padding: 48px var(--gutter); text-align: center; color: var(--ink-3); font-size: 15px; line-height: 1.5; }
        .ms-qty { background: transparent; border: 0; border-bottom: 1px solid transparent; font-size: 13px; width: 110px; padding: 2px 0; outline: 0; color: var(--ink-2); }
        .ms-qty::placeholder { color: #b3afa8; }
        .ms-qty:focus { border-bottom-color: var(--ink-3); }

        /* Dock inferior: vive en el flujo (no flota), así nunca tapa la lista */
        .ms-dock { background: var(--paper); border-top: 1px solid var(--rule); padding: 10px var(--gutter) calc(10px + var(--sab)); display: flex; flex-direction: column; gap: 8px; }
        .ms-toast { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px; color: var(--ink-2); min-height: 40px; }

        /* Navegación inferior (variantes de prueba A/B/C) */
        .ms-bottomnav { background: var(--paper); border-top: 1px solid var(--rule); padding: 0 8px var(--sab); display: flex; align-items: stretch; }
        .ms-navbtn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 54px; font-size: 11px; color: var(--ink-3); }
        .ms-navbtn[aria-current="page"] { color: var(--ink); font-weight: 600; }
        .ms-navbtn .ms-count { margin: 0; font-size: 11px; }
        .ms-navadd { flex: 1; display: flex; align-items: center; justify-content: center; }
        .ms-navadd span { width: 48px; height: 48px; border-radius: 24px; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; }
        .ms-seg { display: flex; flex: 1; min-width: 0; background: var(--paper-2); border-radius: 10px; padding: 3px; }
        .ms-seg button { flex: 1; min-height: 40px; border-radius: 8px; font-size: 14px; color: var(--ink-2); }
        .ms-seg button[aria-selected="true"] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--rule); }
        .ms-dock.over-nav { padding-bottom: 10px; }
        .ms-add.on-paper { border: 1px solid var(--rule); border-radius: 10px; background: #fff; margin: 0; padding-left: 12px; }
        .ms-add.on-paper input { color: var(--ink); }
        .ms-add.on-paper input::placeholder { color: var(--ink-3); }
        .ms-composer { background: var(--paper); border-top: 1px solid var(--rule); padding: 8px var(--gutter) calc(8px + var(--sab)); }
        .ms-composer.kb { padding-bottom: 8px; }

        /* Botones */
        .ms-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 10px; font-size: 16px; font-weight: 600; width: 100%; }
        .ms-btn-primary { background: var(--ink); color: var(--paper); }
        .ms-btn-accent { background: var(--accent); color: #fff; }
        .ms-btn-secondary { background: transparent; color: var(--ink); border: 1px solid var(--rule); }
        .ms-btn-danger { background: transparent; color: var(--danger); border: 1px solid #e7c9c6; }
        .ms-btn:disabled { opacity: .4; }
        .ms-btn:active:not(:disabled) { transform: scale(.99); opacity: .9; }
        .ms-link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--rule); font-size: 14px; padding: 8px 0; }
        .ms-link-strong { color: var(--ink); font-weight: 600; font-size: 15px; padding: 8px 4px; }

        /* Hojas (modales) */
        .ms-overlay { position: absolute; inset: 0; background: rgba(22,22,21,.45); display: flex; align-items: flex-end; justify-content: center; }
        .ms-sheet { background: var(--paper); width: 100%; max-height: calc(100% - max(12px, var(--sat))); display: flex; flex-direction: column; border-radius: 14px 14px 0 0; animation: sheetIn .28s cubic-bezier(.16,1,.3,1); }
        .ms-sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 8px 8px var(--gutter); border-bottom: 1px solid var(--rule); flex-shrink: 0; }
        .ms-sheet-title { font-size: 22px; line-height: 1.2; }
        .ms-sheet-body { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px var(--gutter) 20px; }
        .ms-sheet-foot { flex-shrink: 0; padding: 10px var(--gutter) calc(12px + var(--sab)); border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 8px; }
        .ms-sheet-head + .ms-sheet-foot { border-top: 0; }
        .ms-sheet-body.no-foot { padding-bottom: calc(20px + var(--sab)); }
        @keyframes sheetIn { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
        @media (min-width: 640px) { .ms-overlay { align-items: center; padding: 24px; } .ms-sheet { border-radius: 14px; max-width: 420px; } }

        /* Formularios */
        .ms-field { display: block; }
        .ms-label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 4px; }
        .ms-hint { font-size: 13px; color: var(--ink-3); margin-top: 4px; line-height: 1.4; }
        .ms-input { width: 100%; background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 11px 12px; outline: 0; min-height: 46px; }
        .ms-input:focus { border-color: var(--ink-3); }
        .ms-section { border-top: 1px solid var(--rule); padding-top: 16px; margin-top: 16px; }
        .ms-h { font-size: 13px; color: var(--ink-2); font-variant: small-caps; text-transform: lowercase; letter-spacing: .02em; margin-bottom: 8px; }
        .ms-prose { font-size: 16px; line-height: 1.55; white-space: pre-wrap; }

        .mic-active { animation: pulse 1.5s infinite; background: var(--danger) !important; color: #fff !important; border-color: var(--danger) !important; }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(163,38,31,.5); } 70% { box-shadow: 0 0 0 10px rgba(163,38,31,0); } 100% { box-shadow: 0 0 0 0 rgba(163,38,31,0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-enter { animation: fadeIn .2s ease-out; }

        /* ===== Direcciones v27 (prueba): interfaz simplificada + paleta por dirección ===== */
        [data-dir] { --card: var(--paper); }
        [data-dir="fresco"] { --paper: #ffffff; --paper-2: #f0f4f1; --ink: #13201a; --ink-2: #48574f; --ink-3: #85928a; --rule: #e3e9e5; --accent: #1f9d57; --accent-soft: #e2f3e8; --brand: #1f9d57; }
        [data-dir="mercado"] { --paper: #ffffff; --paper-2: #f8f1ec; --ink: #241915; --ink-2: #5f5049; --ink-3: #9b8b83; --rule: #f0e6e0; --accent: #e5572b; --accent-soft: #fde9e1; --brand: #e5572b;
            font-family: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif; }
        [data-dir="claro"] { --paper: #f2f2f7; --card: #ffffff; --paper-2: #e6e6eb; --ink: #111114; --ink-2: #505058; --ink-3: #8e8e93; --rule: #e1e1e6; --accent: #2f6fe4; --accent-soft: #e5eefc; --brand: #2f6fe4; }
        [data-dir] .serif { font-family: inherit; font-weight: 700; letter-spacing: -.01em; }
        [data-dir] .ms-sheet-title { font-size: 20px; }
        [data-dir] .ms-btn-primary { background: var(--brand); color: #fff; }
        [data-dir] .ms-h { font-variant: normal; text-transform: none; font-weight: 600; letter-spacing: 0; }
        [data-dir] .ms-group { font-variant: normal; text-transform: none; font-weight: 600; letter-spacing: 0; background: var(--paper-2); color: var(--ink-2); padding: 8px var(--gutter); border-bottom: 0; }
        [data-dir="claro"] .ms-group { background: transparent; padding: 18px 4px 6px; }
        [data-dir] .ms-sheet { background: var(--card); }
        [data-dir] .ms-input { background: var(--paper-2); border-color: transparent; }
        .ms-shead { background: var(--paper); padding: calc(max(12px, var(--sat)) + 8px) var(--gutter) 8px; }
        .ms-stitle { font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1; }
        .ms-ssub { font-size: 14px; color: var(--ink-3); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
        .ms-dot { width: 7px; height: 7px; border-radius: 4px; flex-shrink: 0; }
        .ms-stools { padding: 2px var(--gutter) 10px; }
        .ms-ssearch { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; height: 40px; padding: 0 12px; border-radius: 10px; background: var(--paper-2); color: var(--ink-3); }
        [data-dir="claro"] .ms-ssearch { background: #e4e4e9; }
        .ms-ssearch input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; font-size: 16px; color: var(--ink); }
        .ms-ssearch input::placeholder { color: var(--ink-3); }
        .ms-sfilter { color: var(--ink-2); }
        .ms-sfilter[aria-pressed="true"] { color: var(--accent); background: var(--accent-soft); }
        .ms-sactive { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--ink-2); margin-top: 6px; }
        .ms-sactive .ms-link-strong { color: var(--accent); font-size: 14px; }
        .ms-slist { border-top: 1px solid var(--rule); }
        [data-dir="claro"] .ms-slist { border-top: 0; margin: 0 var(--gutter); border-radius: 12px; overflow: hidden; }
        [data-dir="claro"] .ms-slist .ms-srow:last-child { border-bottom: 0; }
        .ms-srow { display: flex; align-items: center; gap: 2px; min-height: 58px; padding: 0 6px 0 var(--gutter); background: var(--card); border-bottom: 1px solid var(--rule); }
        [data-dir="claro"] .ms-srow { padding-left: 12px; }
        .ms-srow.is-inactive { opacity: .55; }
        .ms-scheck { width: 44px; height: 48px; margin-left: -8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .ms-scheck span { width: 26px; height: 26px; border-radius: 13px; border: 2px solid #c4cac6; display: flex; align-items: center; justify-content: center; color: #fff; }
        .ms-srow.is-cart .ms-scheck span { background: var(--accent); border-color: var(--accent); }
        .ms-sbody { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; text-align: left; padding: 9px 0; }
        .ms-sname { font-size: 17px; line-height: 1.25; color: var(--ink); max-width: 100%; }
        .ms-srow.is-cart .ms-sname { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-3); }
        .ms-smeta { font-size: 13px; color: var(--ink-3); margin-top: 2px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .ms-smeta.danger { color: var(--danger); }
        .ms-sfaint { color: #b8beba; width: 36px; }
        .ms-sadd { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 12px; margin-right: 6px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); font-size: 14px; font-weight: 600; flex-shrink: 0; }
        [data-dir] .ms-seg { background: var(--paper-2); }
        [data-dir="claro"] .ms-seg { background: #e4e4e9; }
        [data-dir] .ms-seg button { font-size: 15px; }
        [data-dir] .ms-seg button[aria-selected="true"] { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.08); color: var(--ink); }
        [data-dir="fresco"] .ms-seg button[aria-selected="true"], [data-dir="mercado"] .ms-seg button[aria-selected="true"] { background: #fff; }
        [data-dir] .ms-bottomnav { background: var(--card); border-top-color: var(--rule); }
        [data-dir="claro"] .ms-bottomnav { background: #f9f9fb; }
        [data-dir] .ms-navbtn { font-size: 12px; }
        [data-dir] .ms-navbtn[aria-current="page"] { color: var(--accent); }
        [data-dir] .ms-navadd span { background: var(--brand); color: #fff; width: 52px; height: 52px; border-radius: 26px; }
        [data-dir] .ms-dock { background: var(--card); border-top: 0; padding-top: 8px; }
        [data-dir="claro"] .ms-dock { background: var(--paper); }
        [data-dir] .ms-composer { background: var(--card); border-top-color: var(--rule); }
        [data-dir] .ms-add.on-paper { border: 0; background: var(--paper-2); border-radius: 22px; padding-left: 16px; min-height: 44px; }
        [data-dir] .ms-add.on-paper input { padding: 10px 0; }
        .ms-mic { color: var(--accent); }
        .ms-menu { margin: -8px calc(-1 * var(--gutter)) 0; }
        .ms-menu-item { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 52px; padding: 0 var(--gutter); font-size: 17px; color: var(--ink); border-bottom: 1px solid var(--rule); cursor: pointer; text-align: left; }
        .ms-menu-item svg { color: var(--accent); }
        .ms-menu-foot { display: block; width: 100%; padding: 16px var(--gutter) 4px; font-size: 13px; color: var(--ink-3); text-align: left; }
        .ms-sh { font-size: 13px; font-weight: 600; color: var(--ink-2); margin-bottom: 8px; }
        .ms-opts { display: flex; flex-wrap: wrap; gap: 8px; }
        .ms-opt { min-height: 40px; padding: 0 14px; border-radius: 10px; background: var(--paper-2); color: var(--ink); font-size: 15px; }
        .ms-opt[aria-pressed="true"] { background: var(--accent); color: #fff; font-weight: 600; }
        /* Mercado: letra grande y cabecera cálida */
        [data-dir="mercado"] .ms-shead { background: #fff3ec; }
        [data-dir="mercado"] .ms-stools { background: #fff3ec; padding-bottom: 12px; }
        [data-dir="mercado"] .ms-ssearch { background: #fff; }
        [data-dir="mercado"] .ms-stitle { font-size: 34px; }
        [data-dir="mercado"] .ms-srow { min-height: 64px; }
        [data-dir="mercado"] .ms-sname { font-size: 19px; font-weight: 500; }
        [data-dir="mercado"] .ms-scheck span { width: 30px; height: 30px; border-radius: 15px; }
        [data-dir="mercado"] .ms-slist { border-top: 0; }
    </style>
</head>
<body>
    <div id="root" class="w-full flex justify-center items-start sm:items-center sm:p-4 bg-gray-100"></div>
    <script>
        // iOS no encoge el layout viewport al abrir el teclado ni con la barra de Safari;
        // visualViewport sí. Fijamos #root al área realmente visible.
        (function () {
            var vv = window.visualViewport, st = document.documentElement.style;
            if (!vv) return;
            var sync = function () {
                st.setProperty('--vv-h', vv.height + 'px');
                st.setProperty('--vv-top', vv.offsetTop + 'px');
            };
            vv.addEventListener('resize', sync);
            vv.addEventListener('scroll', sync);
            sync();
        })();
    </script>

    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then((reg) => {
                    const announce = (worker) => {
                        if (worker && navigator.serviceWorker.controller) {
                            window.__swWaiting = worker;
                            window.dispatchEvent(new CustomEvent('sw-update-available'));
                        }
                    };
                    if (reg.waiting) announce(reg.waiting);
                    reg.addEventListener('updatefound', () => {
                        const w = reg.installing;
                        if (!w) return;
                        w.addEventListener('statechange', () => {
                            if (w.state === 'installed') announce(w);
                        });
                    });
                    setInterval(() => reg.update().catch(() => {}), 60000);
                }).catch(() => {});

                let refreshing = false;
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (refreshing) return;
                    refreshing = true;
                    window.location.reload();
                });
            });
        }
    </script>
</body>
</html>
